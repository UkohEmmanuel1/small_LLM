services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smallllm}
      POSTGRES_USER: ${POSTGRES_USER:-smallllm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-smallllm} -d ${POSTGRES_DB:-smallllm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped
  model:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["-hf","bartowski/DeepSeek-R1-Distill-Qwen-7B-GGUF:Q4_K_M","--host","0.0.0.0","--port","8080","--ctx-size","8192","--n-gpu-layers","99","--alias","deepseek-r1-distill-qwen-7b"]
    expose: ["8080"]
    volumes: [model-cache:/root/.cache]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgresql://${POSTGRES_USER:-smallllm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smallllm}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INFERENCE_URL: http://model:8080/v1/chat/completions
      INFERENCE_MODEL: deepseek-r1-distill-qwen-7b
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1024}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
      model: {condition: service_started}
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  model-cache:
