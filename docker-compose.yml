services:
  model:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -hf
      - bartowski/DeepSeek-R1-Distill-Qwen-7B-GGUF:Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "99"
      - --alias
      - deepseek-r1-distill-qwen-7b
    expose:
      - "8080"
    volumes:
      - model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build: .
    environment:
      MODEL_ID: deepseek-r1-distill-qwen-7b
      INFERENCE_URL: http://model:8080/v1/chat/completions
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1024}
      DEMO_REQUESTS_PER_MINUTE: ${DEMO_REQUESTS_PER_MINUTE:-5}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - model
    restart: unless-stopped

volumes:
  model-cache:
